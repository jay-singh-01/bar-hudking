<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0a0a0f" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="description" content="Find Bangalore's best bars, pubs, breweries, cafés and restaurants — ratings, prices for two, maps, lists and your own food diary." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="preload" href="/data/places.json" as="fetch" crossorigin />
    <style>
      /* Splash: shown instantly from HTML (no JS/CSS wait), faded out by
         main.tsx once the catalogue is ready and the animation has played. */
      html, body { background: #0a0a0f; margin: 0; }
      #splash {
        position: fixed; inset: 0; z-index: 100; overflow: hidden;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        background: radial-gradient(ellipse at 50% 42%, #1c1408 0%, #0a0a0f 62%);
        font-family: "Plus Jakarta Sans", ui-sans-serif, system-ui, sans-serif;
        transition: opacity 0.7s ease, transform 0.7s ease;
      }
      #splash.splash-out { opacity: 0; transform: scale(1.05); pointer-events: none; }
      .splash-glow {
        position: absolute; top: 50%; left: 50%; width: 340px; height: 340px; margin: -230px 0 0 -170px; border-radius: 50%;
        background: radial-gradient(circle, rgba(242, 196, 109, 0.22), transparent 65%);
        animation: sp-breathe 3.2s ease-in-out 1.2s infinite both;
      }
      .splash-mark { position: relative; width: 150px; height: 150px; animation: sp-rise 1s cubic-bezier(0.2, 0.8, 0.2, 1) both; }
      .splash-mark .draw { fill: none; stroke-dasharray: 340; stroke-dashoffset: 340; }
      .splash-mark .ring { animation: sp-draw 1.4s 0.15s cubic-bezier(0.6, 0, 0.2, 1) forwards; }
      .splash-mark .glass { animation: sp-draw 1.1s 0.55s cubic-bezier(0.6, 0, 0.2, 1) forwards; }
      .splash-mark .drink { transform: translateY(26px); animation: sp-pour 1s 1.2s cubic-bezier(0.3, 0.9, 0.3, 1) forwards; }
      .splash-mark .olive { opacity: 0; transform-origin: 71px 52px; animation: sp-pop 0.5s 1.9s cubic-bezier(0.3, 1.6, 0.5, 1) forwards; }
      .splash-mark .crown { opacity: 0; transform: translateY(-10px); animation: sp-crown 0.7s 2s cubic-bezier(0.2, 0.8, 0.2, 1) forwards; }
      .splash-mark .spark { opacity: 0; transform-box: fill-box; transform-origin: center; animation: sp-twinkle 1.6s ease-in-out infinite; }
      .splash-word {
        position: relative; margin-top: 26px; font-size: 32px; font-weight: 800; letter-spacing: -0.02em;
        background: linear-gradient(90deg, #f7d58b, #ff7a1a 45%, #ff3d7f); -webkit-background-clip: text; background-clip: text; color: transparent;
        animation: sp-word 1s 1.1s cubic-bezier(0.2, 0.8, 0.2, 1) both;
      }
      .splash-tag {
        position: relative; margin-top: 8px; font-size: 12px; color: #a3a3b5; letter-spacing: 0.22em; text-transform: uppercase;
        animation: sp-fade 0.9s 1.6s ease both;
      }
      .splash-bar {
        position: relative; margin-top: 38px; width: 110px; height: 2px; border-radius: 2px; overflow: hidden;
        background: rgba(255, 255, 255, 0.07); animation: sp-fade 0.6s 1.8s ease both;
      }
      .splash-bar span {
        position: absolute; inset: 0; width: 40%; border-radius: 2px;
        background: linear-gradient(90deg, transparent, #f2c46d, transparent);
        animation: sp-sweep 1.4s ease-in-out infinite;
      }
      @keyframes sp-rise { from { opacity: 0; transform: translateY(18px) scale(0.94); } to { opacity: 1; transform: none; } }
      @keyframes sp-draw { to { stroke-dashoffset: 0; } }
      @keyframes sp-pour { to { transform: none; } }
      @keyframes sp-pop { from { opacity: 0; transform: scale(0.2); } to { opacity: 1; transform: none; } }
      @keyframes sp-crown { to { opacity: 1; transform: none; } }
      @keyframes sp-twinkle { 0%, 100% { opacity: 0; transform: scale(0.4); } 50% { opacity: 1; transform: scale(1); } }
      @keyframes sp-word { from { opacity: 0; letter-spacing: 0.12em; filter: blur(6px); } to { opacity: 1; letter-spacing: -0.02em; filter: none; } }
      @keyframes sp-fade { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
      @keyframes sp-breathe { 0%, 100% { transform: scale(0.9); opacity: 0.6; } 50% { transform: scale(1.1); opacity: 1; } }
      @keyframes sp-sweep { from { transform: translateX(-110%); } to { transform: translateX(260%); } }
      @media (prefers-reduced-motion: reduce) {
        #splash *, #splash *::before { animation-duration: 0.01ms !important; animation-delay: 0s !important; }
      }
    </style>
    <title>BarHudking</title>
  </head>
  <body>
    <div id="splash" aria-hidden="true">
      <div class="splash-glow"></div>
      <svg class="splash-mark" viewBox="0 0 120 120">
        <defs>
          <linearGradient id="sp-gold" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#f7d58b" />
            <stop offset="1" stop-color="#d99a3a" />
          </linearGradient>
          <linearGradient id="sp-drink" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#ff9a3d" />
            <stop offset="1" stop-color="#ff3d7f" />
          </linearGradient>
          <clipPath id="sp-bowl"><path d="M41 50 H79 L60 72 Z" /></clipPath>
        </defs>
        <circle class="draw ring" cx="60" cy="60" r="54" stroke="url(#sp-gold)" stroke-width="2.5" />
        <g clip-path="url(#sp-bowl)"><rect class="drink" x="30" y="46" width="60" height="30" fill="url(#sp-drink)" /></g>
        <path class="draw glass" d="M34 42 H86 L60 72 Z M60 72 V92 M47 93 H73" stroke="url(#sp-gold)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />
        <circle class="olive" cx="71" cy="52" r="4" fill="#9fd36b" stroke="#0a0a0f" stroke-width="1.5" />
        <path class="crown" d="M47 32 L50 20 L57 27 L60 18 L63 27 L70 20 L73 32 Z" fill="url(#sp-gold)" />
        <path class="spark" style="animation-delay: 2.3s" d="M92 30 l1.6 4 4 1.6 -4 1.6 -1.6 4 -1.6 -4 -4 -1.6 4 -1.6 z" fill="#f7d58b" />
        <path class="spark" style="animation-delay: 2.9s" d="M26 76 l1.2 3 3 1.2 -3 1.2 -1.2 3 -1.2 -3 -3 -1.2 3 -1.2 z" fill="#f7d58b" />
      </svg>
      <div class="splash-word">BarHudking</div>
      <div class="splash-tag">Bangalore after dark</div>
      <div class="splash-bar"><span></span></div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
